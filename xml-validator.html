<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Validator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --input-bg: #1e1e1e;
            --input-border: #333333;
            --button-bg: #333333;
            --button-hover: #555555;
            --button-text: #ffffff;
            --error-color: #ff6b6b;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        h1 {
            text-align: center;
        }

        /* ===== LINE NUMBER WRAPPER (ONLY ADDITION) ===== */
        .editor-wrapper {
            display: flex;
            width: 100%;
        }
        .line-numbers {
            width: 45px;
            padding: 10px 5px;
            background-color: #1a1a1a;
            color: #888;
            text-align: right;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 20px;
            user-select: none;
            overflow: hidden;
            border: 1px solid #333;
            border-right: none;
        }
        /* ============================================= */

        textarea {
            width: 100%;
            height: auto;
            min-height: 300px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: var(--input-bg);
            color: var(--text-color);
            overflow: hidden;
            resize: vertical;
        }

        button {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 10px 20px;
            margin: 10px 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: var(--button-hover);
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .theme-toggle {
            position: absolute;
            top: 40px;
            right: 20px;
        }

        /* ===== HEADER STYLES ===== */
        .header {
            width: 100vw;
            min-width: 100vw;
            background: var(--header-bg);
            border-bottom: 1px solid var(--header-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 56px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            box-sizing: border-box;
        }
        .header .header-left {
            display: flex;
            align-items: center;
        }
        .header .header-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-left: 10px;
            color: var(--text-color);
            letter-spacing: 1px;
        }
        .header .header-icon {
            color: var(--header-icon);
            font-size: 2em;
            cursor: pointer;
            transition: color 0.2s;
        }
        .header .header-icon:hover {
            color: var(--button-hover);
        }
        .header .header-link {
            color: var(--text-color);
            font-size: 2em;
            margin-left: 18px;
            margin-right: 0;
            transition: color 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            height: 56px;
        }
        .header .header-link i {
            display: block;
            font-size: 1em;
        }
        .header .header-link:hover {
            color: #0a66c2;
        }
        /* ========================= */
    </style>
</head>
<body>
<div class="header">
        <div class="header-left">
            <i class="fas fa-tools header-icon" onclick="window.location.href='index.html'" title="Dev Tools Home"></i>
            <span class="header-title">SI Dev Tools</span>
        </div>
        <a class="header-link" href="https://www.linkedin.com/in/sujeevan-ilanthirayan" target="_blank" title="My LinkedIn">
            <i class="fab fa-linkedin"></i>
        </a>
    </div>
    <br>
    <div class="main-content">
        <h1>XML Validator</h1>
        <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>

        <!-- ===== EDITOR WITH LINE NUMBERS ===== -->
        <div class="editor-wrapper">
            <div id="lineNumbers" class="line-numbers">1</div>
            <textarea id="xmlInput" placeholder="Enter XML here..."></textarea>
        </div>
        <!-- =================================== -->

        <br>
        <button onclick="validateXML()">Validate XML</button>
        <div id="result" class="result"></div>

        <script>
            let isDark = true;

            // Set sample XML
            const xmlInput = document.getElementById('xmlInput');
            xmlInput.value = `<?xml version="1.0" encoding="UTF-8"?>
    <bookstore>
        <book category="fiction">
            <title>The Great Gatsby</title>
            <author>F. Scott Fitzgerald</author>
            <year>1925</year>
            <price>29.99</price>
        </book>
        <book category="non-fiction">
            <title>Steve Jobs</title>
            <author>Walter Isaacson</author>
            <year>2011</year>
            <price>39.99</price>
        </book>
    </bookstore>`;

            function toggleTheme() {
                isDark = !isDark;
                const root = document.documentElement;
                if (isDark) {
                    root.style.setProperty('--bg-color', '#121212');
                    root.style.setProperty('--text-color', '#ffffff');
                    root.style.setProperty('--input-bg', '#1e1e1e');
                    root.style.setProperty('--button-bg', '#333333');
                    root.style.setProperty('--button-hover', '#555555');
                    root.style.setProperty('--button-text', '#ffffff');
                } else {
                    root.style.setProperty('--bg-color', '#ffffff');
                    root.style.setProperty('--text-color', '#000000');
                    root.style.setProperty('--input-bg', '#f0f0f0');
                    root.style.setProperty('--button-bg', '#cccccc');
                    root.style.setProperty('--button-hover', '#aaaaaa');
                    root.style.setProperty('--button-text', '#000000');
                }
            }

            function validateXML() {
                const xmlText = xmlInput.value;
                const resultDiv = document.getElementById('result');

                if (!xmlText.trim()) {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = 'Please enter XML to validate.';
                    return;
                }

                try {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                    const parseError = xmlDoc.getElementsByTagName('parsererror');

                    if (parseError.length > 0) {
                        resultDiv.className = 'result error';
                        resultDiv.textContent = 'XML is invalid:\n' + parseError[0].textContent;
                    } else {
                        resultDiv.className = 'result success';
                        resultDiv.textContent = 'XML is valid!';
                    }
                } catch (e) {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = 'Error validating XML: ' + e.message;
                }
            }

            /* ===== LINE NUMBER LOGIC (ONLY ADDITION) ===== */
            const lineNumbers = document.getElementById('lineNumbers');

            function updateLineNumbers() {
                const lines = xmlInput.value.split('\n').length;
                lineNumbers.innerHTML = Array.from(
                    { length: lines },
                    (_, i) => i + 1
                ).join('<br>');
            }

            function autoResizeTextarea() {
                xmlInput.style.height = 'auto';
                xmlInput.style.height = xmlInput.scrollHeight + 'px';
            }

            xmlInput.addEventListener('input', () => {
                updateLineNumbers();
                autoResizeTextarea();
            });
            xmlInput.addEventListener('scroll', () => {
                lineNumbers.scrollTop = xmlInput.scrollTop;
            });

            updateLineNumbers();
            autoResizeTextarea();
            /* ============================================ */
        </script>
    </div>
</body>
</html>
